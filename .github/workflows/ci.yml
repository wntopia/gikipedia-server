name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Mill dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.mill
            out/mill-build
          key: ${{ runner.os }}-mill-${{ hashFiles('build.mill') }}
          restore-keys: |
            ${{ runner.os }}-mill-

      - name: Set up Mill
        uses: zhutmost/setup-mill@v1.3.0
        with:
          mill-version: 1.1.8

      - name: Compile
        run: mill compile

      - name: Test
        run: mill test

      - name: Check formatting
        run: mill spotless --check

      - name: Assemble
        run: mill assembly

  notify:
    name: Notify Discord
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}

    steps:
      - name: Resolve notification metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          short_sha="${SOURCE_SHA:0:7}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            context="[PR #${PR_NUMBER}](${SERVER_URL}/${REPOSITORY}/pull/${PR_NUMBER}) · \`${HEAD_REF}\` → \`${BASE_REF}\`"
          else
            context="Push · \`${REF_NAME}\`"
          fi
          {
            printf 'short_sha=%s\n' "${short_sha}"
            printf 'context=%s\n' "${context}"
          } >> "${GITHUB_OUTPUT}"

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          status: ${{ needs.build.result }}
          nofail: false
          nocontext: true
          title: "Gikipedia Server CI"
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: Gikipedia CI
          description: |
            ${{ steps.metadata.outputs.context }} · `${{ steps.metadata.outputs.short_sha }}` · by **${{ github.actor }}**
            ─────────────────────────────
            **Checks:** `Compile` · `Test` · `Spotless` · `Assembly`
            **Result:** `${{ needs.build.result }}`
            **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
