name: CD Stage

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-stage
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Stage
    runs-on: ubuntu-latest
    environment: stage

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          APPLICATION_YAML: ${{ secrets.STAGE_APPLICATION_YAML }}
        with:
          host: ${{ secrets.STAGE_SSH_HOST }}
          username: ${{ secrets.STAGE_SSH_USERNAME }}
          key: ${{ secrets.STAGE_SSH_KEY }}
          port: ${{ secrets.STAGE_SSH_PORT }}
          envs: APPLICATION_YAML
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.STAGE_APP_DIR }}"
            REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"
            BRANCH="develop"

            if [ -d "${APP_DIR}/.git" ]; then
              cd "${APP_DIR}"
              git fetch origin "${BRANCH}"
              git checkout "${BRANCH}"
              git reset --hard "origin/${BRANCH}"
            else
              git clone --branch "${BRANCH}" "${REPO_URL}" "${APP_DIR}"
              cd "${APP_DIR}"
            fi

            printf '%s' "${APPLICATION_YAML}" > src/main/resources/application.yaml

            docker compose up -d

            ./mill launcher

            sudo systemctl restart gikipedia-server-stage

            # restart 직후 status는 기동 성공 여부를 알 수 없으므로,
            # 앱 포트가 HTTP 응답을 줄 때까지 기다리고 그 사이 프로세스가 죽거나 재시작되면 실패 처리한다.
            SERVICE="gikipedia-server-stage"
            APP_PORT="${{ vars.STAGE_APP_PORT || '8080' }}"
            STARTUP_TIMEOUT_SECONDS=180
            POLL_INTERVAL_SECONDS=5
            BASE_RESTARTS="$(systemctl show -p NRestarts --value "${SERVICE}")"

            for ((elapsed = 0; elapsed < STARTUP_TIMEOUT_SECONDS; elapsed += POLL_INTERVAL_SECONDS)); do
              sleep "${POLL_INTERVAL_SECONDS}"

              if ! systemctl is-active --quiet "${SERVICE}" \
                || [ "$(systemctl show -p NRestarts --value "${SERVICE}")" != "${BASE_RESTARTS}" ]; then
                echo "::error::${SERVICE} 기동 중 프로세스가 종료되었습니다."
                sudo systemctl status gikipedia-server-stage --no-pager || true
                exit 1
              fi

              if curl -s -o /dev/null --max-time 3 "http://localhost:${APP_PORT}/"; then
                echo "${SERVICE} 기동 확인 (port ${APP_PORT}, $((elapsed + POLL_INTERVAL_SECONDS))s)"
                sudo systemctl status gikipedia-server-stage --no-pager
                exit 0
              fi
            done

            echo "::error::${SERVICE}가 ${STARTUP_TIMEOUT_SECONDS}초 안에 port ${APP_PORT}에서 응답하지 않았습니다."
            sudo systemctl status gikipedia-server-stage --no-pager || true
            exit 1

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          status: ${{ job.status }}
          nofail: false
          nocontext: true
          title: "Gikipedia Server CD (Stage)"
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: Gikipedia CD
          description: |
            Push · `develop` · `${{ github.sha }}` · by **${{ github.actor }}**
            ─────────────────────────────
            **Result:** `${{ job.status }}`
            **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
