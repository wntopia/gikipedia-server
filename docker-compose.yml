services:
  # DB 비밀번호는 기본값 없이 환경변수(.env)로만 받는다. CD가 GitHub Secrets로 .env를 생성한다.
  # DB 포트는 호스트의 127.0.0.1에만 바인딩한다.
  # (Docker가 열어주는 포트는 ufw 규칙을 우회하므로 0.0.0.0으로 열면 외부에 그대로 노출된다.)
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gikipedia}
      MYSQL_USER: ${MYSQL_USER:-gikipedia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:7
    restart: unless-stopped
    # WiredTiger 캐시 기본값은 (RAM - 1GB)의 50%라 서버 메모리를 크게 잡아먹으므로 상한을 둔다.
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-gikipedia}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-gikipedia}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  seaweedfs-master:
    image: chrislusf/seaweedfs:3.85
    command: master -ip=seaweedfs-master -mdir=/data
    restart: unless-stopped
    ports:
      - "9333:9333"
    volumes:
      - seaweedfs-master-data:/data

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.85
    # 컨테이너 내부 포트는 8080이지만, 애플리케이션(gikipedia-server)이 같은 호스트에서 8080을 쓰므로
    # 호스트 쪽은 18080으로 매핑해 충돌을 피한다. filer가 volume을 찾는 건 내부 네트워크(9333)로 하므로
    # 이 매핑은 순수히 사람이 볼륨 서버 상태를 직접 확인할 때만 쓰인다.
    command: volume -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume -dir=/data -port=8080
    restart: unless-stopped
    ports:
      - "18080:8080"
    volumes:
      - seaweedfs-volume-data:/data
    depends_on:
      - seaweedfs-master

  seaweedfs-filer:
    image: chrislusf/seaweedfs:3.85
    command: filer -master=seaweedfs-master:9333 -ip=seaweedfs-filer -port=8888
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - seaweedfs-filer-data:/data
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume

volumes:
  seaweedfs-master-data:
  seaweedfs-volume-data:
  seaweedfs-filer-data:
  mysql-data:
  mongo-data:
  redis-data:
